<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title>Throttle</title>
	<link rel="stylesheet" href="pi.css" />
</head>

<body>
	<h1>Throttle dial</h1>
	<p class="note">
		<kbd>Turn</kbd> changes the throttle by 1%.<br />
		<kbd>Hold and turn</kbd> changes it by 5%.<br />
		<kbd>Push</kbd> cuts the throttle to 0%.<br />
		<kbd>Touch</kbd> opens it to 100%.
	</p>
	<div class="status">The touchscreen shows the throttle the game reports, so it also follows the in-game controls.</div>
	<script src="pi.js"></script>
</body>

</html>
