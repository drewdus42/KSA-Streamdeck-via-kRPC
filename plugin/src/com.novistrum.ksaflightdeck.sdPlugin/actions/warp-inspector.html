<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title>Time Warp</title>
	<link rel="stylesheet" href="pi.css" />
</head>

<body>
	<h1>Time warp dial</h1>
	<p class="note">
		<kbd>Turn</kbd> steps the simulation speed: pause, 1x, 2x, 5x, 10x, 50x, 100x,
		500x, 1 000x, 5 000x, 10 000x, 50 000x and 100 000x.<br />
		<kbd>Push</kbd> pauses or resumes.<br />
		<kbd>Touch</kbd> returns to 1x.
	</p>
	<div class="status">KSA sets the speed as a multiple of real time, so the dial shows exactly what the game reports.</div>
	<script src="pi.js"></script>
</body>

</html>
